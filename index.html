            </div>
            
            <div class="flex items-center gap-4">
                <button id="play-pause-btn" disabled class="w-12 h-12 rounded-full bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center shadow-lg disabled:opacity-40 disabled:cursor-not-allowed transition-all">
                    <i id="play-icon" class="fa-solid fa-play text-base ml-0.5"></i>

            </div>

            <div class="hidden sm:flex items-center justify-end gap-3 w-1/3 text-slate-400">

            </div>
        </div>
    </footer>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition-colors">Sačuvaj u moju bazu</button>

            { name: "Kiss FM Romania", url: "https://live.kissfm.ro/kissfm.mp3", countrycode: "RO", tags: "Top 40, Dance", logo: "" },
            { name: "Radyo 1 Hungary", url: "https://stream.radio1.hu/high.mp3", countrycode: "HU", tags: "Dance, Hits", logo: "" },
            { name: "Evropa 2 Czech", url: "https://securestream.croradio.cz/evropa2_128.mp3", countrycode: "CZ", tags: "Pop, Dance", logo: "" },
            { name: "Fun Radio Slovakia", url: "https://stream.funradio.sk/fun128.mp3", countrycode: "SK", tags: "Pop, Dance", logo: "" },
            { name: "Radio Energy Bulgaria", url: "https://stream.nrj.bg/nrj128", countrycode: "BG", tags: "90s, Pop", logo: "" },
            
            // BALTIK I SKANDINAVIJA
            { name: "Mix Megapol", url: "https://stream.mixmegapol.se/mix_se", countrycode: "SE", tags: "Pop, Variety", logo: "" },
            { name: "Nova Denmark", url: "https://stream.novafm.dk/nova", countrycode: "DK", tags: "Pop, Top 40", logo: "" },
            { name: "SuomiRock", url: "https://stream.radiosuomirock.fi/suomirock", countrycode: "FI", tags: "Rock, Classic", logo: "" },
            { name: "Sky Plus Estonia", url: "https://stream.skyplus.fm/skyplus", countrycode: "EE", tags: "Top 40, Pop", logo: "" },
            { name: "Radio Skonto Latvia", url: "https://stream.radioskonto.lv/skonto", countrycode: "LV", tags: "Pop, Oldies", logo: "" },
            { name: "M-1 Lithuania", url: "https://stream.m-1.fm/m1/mp3", countrycode: "LT", tags: "Pop, Hits", logo: "" }
        ];

        let apiStations = [];
        let combinedStations = [];
        let activeFilter = 'all';
        const audio = new Audio();
        audio.crossOrigin = "anonymous"; 

        async function initRadio() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2500);
            try {
                const response = await fetch('https://de1.api.radio-browser.info/json/stations/topclick/100', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (response.ok) {
                    const data = await response.json();
                    apiStations = data.filter(s => s.url_resolved && s.url_resolved.startsWith('https')).map(s => ({
                        name: s.name, url: s.url_resolved, countrycode: s.countrycode?.toUpperCase(), tags: s.tags, logo: ""
                    }));
                }
            } catch (e) { console.log("Lokalni režim pokrenut."); }
            refreshData();
        }

        function refreshData() {
            const custom = JSON.parse(localStorage.getItem('customRadioStations')) || [];
            combinedStations = [...custom, ...premiumLocalDatabase, ...apiStations];
            const unique = new Map();
            combinedStations.forEach(s => { if(s.name && s.url) unique.set(s.name.toLowerCase(), s); });
            combinedStations = Array.from(unique.values());
            document.getElementById('stats').innerText = `Stanica u sistemu: ${combinedStations.length}`;
            applyFilter();
        }

        function filterBy(type) {
            activeFilter = type;
            document.querySelectorAll('.sidebar-btn').forEach(btn => btn.classList.remove('active'));
            if(window.event && window.event.currentTarget) window.event.currentTarget.classList.add('active');
            applyFilter();
        }

        function applyFilter() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            let filtered = combinedStations;
            if (activeFilter !== 'all' && activeFilter !== 'custom') {
                filtered = combinedStations.filter(s => s.countrycode === activeFilter);
            } else if (activeFilter === 'custom') {
                const customNames = (JSON.parse(localStorage.getItem('customRadioStations')) || []).map(c => c.name.toLowerCase());
                filtered = combinedStations.filter(s => customNames.includes(s.name.toLowerCase()));
            }
            if (query) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(query) || (s.tags && s.tags.toLowerCase().includes(query)));
            }
            render(filtered);
        }

        function render(stations) {
            const grid = document.getElementById('stations-grid');
            grid.innerHTML = '';
            if(stations.length === 0) { document.getElementById('no-results').classList.remove('hidden'); return; }
            document.getElementById('no-results').classList.add('hidden');

            stations.forEach(s => {
                const card = document.createElement('div');
                card.className = "radio-card bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:bg-slate-800/80 hover:border-purple-500/40 transition-all group shrink-0";
                
                const logoContent = s.logo 
                    ? `<img src="${s.logo}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid fa-radio text-lg\'></i>';">`
                    : `<i class="fa-solid fa-radio text-lg"></i>`;

                card.innerHTML = `
                    <div class="w-12 h-12 bg-slate-950 rounded-xl flex items-center justify-center overflow-hidden shrink-0 relative border border-slate-800 mr-4 text-purple-500">
                        ${logoContent}
                        <div class="absolute inset-0 bg-purple-600/80 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <i class="fa-solid fa-play text-white text-xs"></i>
                        </div>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[9px] font-bold text-pink-400 bg-pink-950/30 px-1 py-0.5 rounded shrink-0">${s.countrycode || 'WW'}</span>
                            <h3 class="text-xs font-bold truncate text-slate-200 flex-1">${s.name}</h3>
                        </div>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">${s.tags || 'Muzika uživo'}</p>
                    </div>`;
                card.onclick = () => play(s);
                grid.appendChild(card);
            });
        }

        function play(s) {
            const btn = document.getElementById('play-pause-btn');
            const icon = document.getElementById('play-icon');
            const buffer = document.getElementById('buffer-indicator');
            btn.disabled = false; buffer.classList.remove('hidden');
            icon.className = "fa-solid fa-spinner animate-spin text-base";
            
            document.getElementById('player-title').innerText = s.name;
            document.getElementById('track-info').innerText = "Učitavanje pesme...";

            if (s.logo) {
                document.getElementById('player-logo-box').innerHTML = `<img src="${s.logo}" class="w-full h-full object-cover">`;
            } else {
                document.getElementById('player-logo-box').innerHTML = `<i id="player-placeholder-icon" class="fa-solid fa-radio text-xl text-purple-500"></i>`;
            }

            audio.src = s.url;
            audio.play().then(() => { 
                icon.className = "fa-solid fa-pause text-base"; 
                buffer.classList.add('hidden'); 
                setTimeout(() => { if(audio.duration === Infinity) document.getElementById('track-info').innerText = "Muzika uživo"; }, 1000);
            }).catch(() => { 
                buffer.classList.add('hidden'); 
                icon.className = "fa-solid fa-play text-base ml-0.5"; 
                document.getElementById('track-info').innerText = "Muzika uživo";
            });
        }

        document.getElementById('play-pause-btn').onclick = () => {
            const icon = document.getElementById('play-icon');
            if (audio.paused) { audio.play(); icon.className = "fa-solid fa-pause text-base"; } 
            else { audio.pause(); icon.className = "fa-solid fa-play text-base ml-0.5"; }
        };

        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;
        document.getElementById('search-input').oninput = applyFilter;
        function toggleAdminModal() { document.getElementById('admin-modal').classList.toggle('hidden'); }

        document.getElementById('add-station-form').onsubmit = (e) => {
            e.preventDefault();
            const ns = { 
                name: document.getElementById('custom-name').value, 
                url: document.getElementById('custom-url').value, 
                countrycode: document.getElementById('custom-country').value?.toUpperCase(), 
                tags: "Moja stanica", logo: ""
            };
            const cur = JSON.parse(localStorage.getItem('customRadioStations')) || [];
            cur.unshift(ns); 
            localStorage.setItem('customRadioStations', JSON.stringify(cur));
            toggleAdminModal(); refreshData(); document.getElementById('add-station-form').reset();
        };

        initRadio();
    </script>
</body>
</html>
