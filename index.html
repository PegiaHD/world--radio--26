    <meta charset="UTF-8">

    <title>World Radio 26</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .search-container {
            max-width: 600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .search-box {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            background-color: var(--bg-secondary);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
        }

        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        .station-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .station-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .station-logo {
            width: 70px;
            height: 70px;
            border-radius: 50px;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            overflow: hidden;
            border: 2px solid var(--border);
        }

        .station-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .station-name {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 0.4rem;
            color: var(--text-main);
        }

        .station-tags {
            font-size: 0.75rem;
            color: var(--text-muted);
            background-color: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-bottom: 0.5rem;
        }

        .station-country {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        .current-station-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 200px;
        }

        .current-station-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .current-station-status {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .play-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .play-btn:hover {
            background-color: var(--accent-hover);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 150px;
        }

        .volume-slider {
            flex: 1;
            accent-color: var(--accent);
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .player-bar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
                text-align: center;
            }
            .current-station-info {
                justify-content: center;
            }
            main {
                padding-bottom: 160px;
            }
        }
    </style>
</head>

                card.className = 'station-card';
                
                let logoContent = station.name.substring(0, 2);
                if (station.logo && station.logo !== "") {
                    logoContent = `<img src="${station.logo}" alt="${station.name}" onerror="this.style.display='none'; this.parentElement.innerText='${station.name.substring(0,2)}'">`;
                }

                card.innerHTML = `
                    <div class="station-logo">${logoContent}</div>
                    <div class="station-name">${station.name}</div>
                    <div class="station-tags">${station.tags}</div>
                    <div class="station-country">📍 ${station.countrycode}</div>
                `;

                card.addEventListener('click', () => playStation(station));
                stationsGrid.appendChild(card);
            });
        }

        function playStation(station) {
            if (activeStation && activeStation.url === station.url) {
                togglePlay();
                return;
            }

            currentAudio.src = station.url;
            currentAudio.play()
                .then(() => {
                    isPlaying = true;
                    activeStation = station;
                    playBtn.innerText = '⏸';
                    currentStationName.innerText = station.name;
                    currentStationStatus.innerText = 'Emituje se uživo...';
                })
                .catch(err => {
                    console.error("Greška pri učitavanju strima:", err);
                    currentStationStatus.innerText = 'Strim trenutno nedostupan';
                });
        }

        function togglePlay() {
            if (!activeStation) return;

            if (isPlaying) {
                currentAudio.pause();
                playBtn.innerText = '▶';
                currentStationStatus.innerText = 'Pauzirano';
            } else {
                currentAudio.play()
                    .then(() => {
                        playBtn.innerText = '⏸';
                        currentStationStatus.innerText = 'Emituje se uživo...';
                    })
                    .catch(() => {
                        currentStationStatus.innerText = 'Greška pri ponovnom pokretanju';
                    });
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', togglePlay);

        volumeSlider.addEventListener('input', (e) => {
            currentAudio.volume = e.target.value / 100;
        });

        searchBox.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = premiumLocalDatabase.filter(station => 
                station.name.toLowerCase().includes(query) || 
                station.tags.toLowerCase().includes(query) || 
                station.countrycode.toLowerCase().includes(query)
            );
            renderStations(filtered);
        });

        // Početno učitavanje svih stanica
        renderStations(premiumLocalDatabase);
        currentAudio.volume = volumeSlider.value / 100;
    </script>
</body>
</html>
