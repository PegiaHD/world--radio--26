<!DOCTYPE html>
<html lang="sr">
<head>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .sidebar-btn.active {
            background-color: #1e1b4b !important;
            border-left: 4px solid #a855f7 !important;
            color: #f472b6 !important;
        }
        
        .radio-card {
            height: 76px !important;
            max-height: 76px !important;
            min-height: 76px !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row font-sans antialiased overflow-x-hidden">

    <aside class="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col shrink-0 z-40 md:h-screen md:sticky md:top-0">

        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">

                        <i class="fa-solid fa-radio text-base w-5 text-center"></i> Sve Stanice

                        <i class="fa-solid fa-heart text-base w-5 text-center"></i> Omiljene
                    </button>
                </div>
            </div>

            <div>

                <div class="space-y-1">

            </div>

            </div>
            
            <div class="flex items-center gap-4 shrink-0 w-full sm:w-auto justify-between sm:justify-end">
                <div class="flex items-center gap-2 text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="statsCount">0 Stanica Učitano</span>

                <div class="flex items-center gap-2 bg-gradient-to-b from-slate-900 to-slate-950 px-3 py-1 rounded-xl border border-purple-500/20 shadow-inner group">

                        <i class="fa-solid fa-compact-disc text-purple-400 text-sm group-hover:rotate-180 transition-transform duration-700"></i>
                    </div>
                    <div class="flex flex-col pr-1 text-left">
                        <span class="text-[11px] font-black tracking-tighter text-slate-200 leading-none">PEGIA HD</span>
                        <span class="text-[9px] font-bold text-purple-400 tracking-widest leading-none mt-0.5">&bull; ONLINE &bull;</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 p-6 pb-36">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 w-full" id="stationsGrid">
                </div>
        </main>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-4 flex flex-col sm:flex-row items-center justify-between gap-4 z-50 shadow-2xl">
        <div class="flex items-center gap-3.5 w-full sm:w-1/3 min-w-0">
            <div class="w-12 h-12 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center shrink-0 overflow-hidden" id="playerLogoContainer">
                <i class="fa-solid fa-compact-disc text-xl text-slate-600 animate-spin" style="animation-duration: 4s;"></i>
            </div>
            <div class="min-w-0 text-left">
                <h4 class="text-sm font-semibold text-slate-200 truncate" id="currentStationName">Izaberite stanicu</h4>
                <p class="text-xs text-slate-500 truncate mt-0.5" id="currentStationStatus">Ugašeno</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button id="playBtn" class="w-11 h-11 rounded-full bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center text-lg transition shadow-lg shadow-purple-600/20 active:scale-95">
                <i class="fa-solid fa-play"></i>
            </button>
        </div>

        <div class="flex items-center gap-2.5 w-full sm:w-1/3 justify-end">
            <i class="fa-solid fa-volume-low text-slate-500 text-sm" id="volumeIcon"></i>
            <input type="range" id="volumeSlider" min="0" max="100" value="80"
