            { name: "RTÉ 2FM", url: "https://icecast2.rte.ie/2fm", countrycode: "IE", tags: "Pop, Rock" },
            { name: "RTL 102.5", url: "https://chshicl.topscms.com/rtl1025stream/live/playlist.m3u8", countrycode: "IT", tags: "Top 40, Hits" },
            { name: "Los 40 Spain", url: "https://25653.live.streamtheworld.com/LOS40_SC", countrycode: "ES", tags: "Pop, Latino" },
            { name: "RFM Portugal", url: "https://streaming-live.renascencamedia.pt/rfm/mp3", countrycode: "PT", tags: "Pop, Dance" },
            { name: "Dromos FM", url: "https://stream.dromosfm.gr/dromos898", countrycode: "GR", tags: "Greek Pop" },
            { name: "Super FM Cyprus", url: "https://stream.superfm.com.cy/live", countrycode: "CY", tags: "Pop, Hits" },
            { name: "Bay Malta", url: "https://stream.bay.com.mt/bay", countrycode: "MT", tags: "Top 40, Pop" },
            { name: "RMF FM Poland", url: "https://www.rmfonline.pl/rmf_fm.mp3", countrycode: "PL", tags: "Pop, News" },
            { name: "Kiss FM Romania", url: "https://live.kissfm.ro/kissfm.mp3", countrycode: "RO", tags: "Top 40, Dance" },
            { name: "Radyo 1 Hungary", url: "https://stream.radio1.hu/high.mp3", countrycode: "HU", tags: "Dance, Hits" },
            { name: "Evropa 2 Czech", url: "https://securestream.croradio.cz/evropa2_128.mp3", countrycode: "CZ", tags: "Pop, Dance" },
            { name: "Fun Radio Slovakia", url: "https://stream.funradio.sk/fun128.mp3", countrycode: "SK", tags: "Pop, Dance" },
            { name: "Radio Energy Bulgaria", url: "https://stream.nrj.bg/nrj128", countrycode: "BG", tags: "90s, Pop" },
            { name: "Mix Megapol", url: "https://stream.mixmegapol.se/mix_se", countrycode: "SE", tags: "Pop, Variety" },
            { name: "Nova Denmark", url: "https://stream.novafm.dk/nova", countrycode: "DK", tags: "Pop, Top 40" },
            { name: "SuomiRock", url: "https://stream.radiosuomirock.fi/suomirock", countrycode: "FI", tags: "Rock, Classic" },
            { name: "Sky Plus Estonia", url: "https://stream.skyplus.fm/skyplus", countrycode: "EE", tags: "Top 40, Pop" },
            { name: "Radio Skonto Latvia", url: "https://stream.radioskonto.lv/skonto", countrycode: "LV", tags: "Pop, Oldies" },
            { name: "M-1 Lithuania", url: "https://stream.m-1.fm/m1/mp3", countrycode: "LT", tags: "Pop, Hits" }
        ];

        let apiStations = [];
        let combinedStations = [];
        let activeFilter = 'all';
        const audio = new Audio();
        audio.crossOrigin = "anonymous"; 

        window.addEventListener('DOMContentLoaded', () => {
            // ODMAH učitavamo lokalnu bazu, bez čekanja na eksterni API
            refreshData(); 
            
            // Tek nakon toga bezbedno pokrećemo spoljni API u pozadini
            loadExternalAPI(); 

            const srcInp = document.getElementById('search-input');
            if(srcInp) srcInp.oninput = applyFilter;

            const volSld = document.getElementById('volume-slider');
            if(volSld) volSld.oninput = (e) => audio.volume = e.target.value;

            const ppBtn = document.getElementById('play-pause-btn');
            if(ppBtn) {
                ppBtn.onclick = () => {
                    const icon = document.getElementById('play-icon');
                    if (audio.paused) { 
                        audio.play(); 
                        if(icon) icon.className = "fa-solid fa-pause text-base"; 
                    } else { 
                        audio.pause(); 
                        if(icon) icon.className = "fa-solid fa-play text-base ml-0.5"; 
                    }
                };
            }

            const formEl = document.getElementById('add-station-form');
            if(formEl) {
                formEl.onsubmit = (e) => {
                    e.preventDefault();
                    const ns = { 
                        name: document.getElementById('custom-name').value, 
                        url: document.getElementById('custom-url').value, 
                        countrycode: document.getElementById('custom-country').value, 
                        logo: document.getElementById('custom-logo').value || null,
                        tags: "Moja stanica"
                    };
                    const cur = JSON.parse(localStorage.getItem('customRadioStations')) || [];
                    cur.unshift(ns); 
                    localStorage.setItem('customRadioStations', JSON.stringify(cur));
                    toggleAdminModal(); 
                    refreshData(); 
                    formEl.reset();
                };
            }
        });

        async function loadExternalAPI() {
            try {
                const response = await fetch('https://de1.api.radio-browser.info/json/stations/topclick/150');
                if (response.ok) {
                    const data = await response.json();
                    apiStations = data.filter(s => s.url_resolved && s.url_resolved.startsWith('https')).map(s => ({
                        name: s.name, url: s.url_resolved, countrycode: s.countrycode?.toUpperCase(), tags: s.tags, logo: s.favicon
                    }));
                    // Ako povuče podatke, osvežavamo i njih
                    refreshData(); 
                }
            } catch (e) { 
                console.log("Eksterni API je blokiran ili nedostupan (HTTPS Mixed Content). Rad sa lokalnom bazom."); 
            }
        }

        function refreshData() {
            const custom = JSON.parse(localStorage.getItem('customRadioStations')) || [];
            combinedStations = [...custom, ...premiumLocalDatabase, ...apiStations];
            
            const unique = new Map();
            combinedStations.forEach(s => { 
                if(s.name && s.url) unique.set(s.name.toLowerCase(), s); 
            });
            combinedStations = Array.from(unique.values());
            
            const statsEl = document.getElementById('stats');
            if(statsEl) statsEl.innerText = `Stanica u sistemu: ${combinedStations.length}`;
            
            applyFilter();
        }

        function filterBy(type) {
            activeFilter = type;
            document.querySelectorAll('.sidebar-btn').forEach(btn => btn.classList.remove('active'));
            if(window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            }
            applyFilter();
        }

        function applyFilter() {
            const searchInput = document.getElementById('search-input');
            const query = searchInput ? searchInput.value.toLowerCase().trim() : "";
            let filtered = combinedStations;
            
            if (activeFilter !== 'all' && activeFilter !== 'custom') {
                filtered = combinedStations.filter(s => s.countrycode === activeFilter);
            } else if (activeFilter === 'custom') {
                const customNames = (JSON.parse(localStorage.getItem('customRadioStations')) || []).map(c => c.name.toLowerCase());
                filtered = combinedStations.filter(s => customNames.includes(s.name.toLowerCase()));
            }
            
            if (query) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(query) || (s.tags && s.tags.toLowerCase().includes(query)));
            }
            render(filtered);
        }

        function render(stations) {
            const grid = document.getElementById('stations-grid');
            if(!grid) return;
            
            grid.innerHTML = '';
            const noResultsEl = document.getElementById('no-results');
            
            if(stations.length === 0) { 
                if(noResultsEl) noResultsEl.classList.remove('hidden'); 
                return; 
            }
            if(noResultsEl) noResultsEl.classList.add('hidden');

            stations.forEach(s => {
                const card = document.createElement('div');
                card.className = "radio-card bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:bg-slate-800/80 hover:border-purple-500/40 transition-all group shrink-0";
                
                const logoContent = s.logo 
                    ? `<img src="${s.logo}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=&#34;fa-solid fa-radio text-lg&#34;></i>';">`
                    : `<i class="fa-solid fa-radio text-lg"></i>`;

                card.innerHTML = `
                    <div class="w-12 h-12 bg-slate-950 rounded-xl flex items-center justify-center overflow-hidden shrink-0 relative border border-slate-800 mr-4">
                        <div class="flex items-center justify-center w-full h-full text-purple-500">
                            ${logoContent}
                        </div>
                        <div class="absolute inset-0 bg-purple-600/80 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <i class="fa-solid fa-play text-white text-xs"></i>
                        </div>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[9px] font-bold text-pink-400 bg-pink-950/30 px-1 py-0.5 rounded shrink-0">${s.countrycode || 'WW'}</span>
                            <h3 class="text-xs font-bold truncate text-slate-200 flex-1">${s.name}</h3>
                        </div>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">${s.tags || 'Muzika uživo'}</p>
                    </div>`;
                card.onclick = () => play(s);
                grid.appendChild(card);
            });
        }

        function play(s) {
            const btn = document.getElementById('play-pause-btn');
            const icon = document.getElementById('play-icon');
            const buffer = document.getElementById('buffer-indicator');
            const playerLogoContainer = document.getElementById('player-logo-container');
            
            if(btn) btn.disabled = false; 
            if(buffer) buffer.classList.remove('hidden');
            if(icon) icon.className = "fa-solid fa-spinner animate-spin text-base";
            
            document.getElementById('player-title').innerText = s.name;
            document.getElementById('track-info').innerText = "Učitavanje pesme...";

            audio.pause();
            audio.removeAttribute('src');
            audio.load(); 

            if (s.logo && playerLogoContainer) {
                playerLogoContainer.innerHTML = `<img src="${s.logo}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=&#34;fa-solid fa-radio text-xl text-purple-500&#34;></i>';">`;
            } else if(playerLogoContainer) {
                playerLogoContainer.innerHTML = `<i id="player-placeholder-icon" class="fa-solid fa-radio text-xl text-purple-500"></i>`;
            }

            audio.src = s.url;
            audio.play().then(() => { 
                if(icon) icon.className = "fa-solid fa-pause text-base"; 
                if(buffer) buffer.classList.add('hidden'); 
            }).catch(() => { 
                if(buffer) buffer.classList.add('hidden'); 
                if(icon) icon.className = "fa-solid fa-play text-base ml-0.5"; 
                document.getElementById('track-info').innerText = "Muzika uživo";
            });
        }

        function toggleAdminModal() { 
            const modal = document.getElementById('admin-modal');
            if(modal) modal.classList.toggle('hidden'); 
        }
    </script>
</body>
