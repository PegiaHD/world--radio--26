<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PegiaHD & FM - World Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .sidebar-btn.active {
            background-color: #1e1b4b !important;
            border-left: 4px solid #a855f7 !important;
            color: #f472b6 !important;
        }
        
        .radio-card {
            height: 76px !important;
            max-height: 76px !important;
            min-height: 76px !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row font-sans antialiased overflow-x-hidden">

    <aside class="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col shrink-0 z-40 md:h-screen md:sticky md:top-0">

            <h1 class="text-xl font-extrabold bg-gradient-to-r from-purple-400 via-pink-500 to-red-400 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-tower-broadcast text-purple-500"></i> PegiaHD & FM
            </h1>
            <p class="text-[10px] text-slate-500 font-medium tracking-wider mt-1 uppercase">World Radio Platform</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <div>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block px-3 mb-2">Glavno</span>
                <div class="space-y-1">
                    <button onclick="filterByCountry('ALL')" id="btn-ALL" class="sidebar-btn active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition">
                        <i class="fa-solid fa-radio text-base w-5 text-center"></i> Sve Stanice
                    </button>
                </div>
            </div>

            <div>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block px-3 mb-2">Upravljanje</span>
                <div class="space-y-1">
                    <button onclick="openModal()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-purple-400 hover:bg-purple-950/30 hover:text-purple-300 transition border border-dashed border-purple-500/30">
                        <i class="fa-solid fa-plus-circle text-base w-5 text-center"></i> Dodaj Stanicu
                    </button>
                </div>
            </div>

            <div>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block px-3 mb-2">Države</span>
                <div class="space-y-1">
                    <button onclick="filterByCountry('IT')" id="btn-IT" class="sidebar-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition">
                        <i class="fa-solid fa-globe text-xs text-slate-500 w-5 text-center"></i> Italija (IT)
                    </button>
                    <button onclick="filterByCountry('ES')" id="btn-ES" class="sidebar-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition">
                        <i class="fa-solid fa-globe text-xs text-slate-500 w-5 text-center"></i> Španija (ES)
                    </button>
                    <button onclick="filterByCountry('PT')" id="btn-PT" class="sidebar-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition">
                        <i class="fa-solid fa-globe text-xs text-slate-500 w-5 text-center"></i> Portugal (PT)
                    </button>
                    <button onclick="filterByCountry('GR')" id="btn-GR" class="sidebar-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition">
                        <i class="fa-solid fa-globe text-xs text-slate-500 w-5 text-center"></i> Grčka (GR)
                    </button>
                    <button onclick="filterByCountry('PL')" id="btn-PL" class="sidebar-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition">
                        <i class="fa-solid fa-globe text-xs text-slate-500 w-5 text-center"></i> Poljska (PL)
                    </button>
                    <button onclick="filterByCountry('RO')" id="btn-RO" class="sidebar-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition">
                        <i class="fa-solid fa-globe text-xs text-slate-500 w-5 text-center"></i> Rumunija (RO)
                    </button>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center hidden md:block">
            Premium Global Agregator v2.6
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="bg-slate-900/50 backdrop-blur border-b border-slate-800/80 p-4 sticky top-0 z-30 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="relative w-full sm:max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchBox" placeholder="Pretraži stanice, žanrove..." 
                       class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500">
            </div>
            
            <div class="flex items-center gap-4 shrink-0 w-full sm:w-auto justify-between sm:justify-end">
                <div class="flex items-center gap-2 text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="statsCount">0 Stanica</span>
                </div>
                
                <div class="flex items-center gap-2 bg-gradient-to-b from-slate-900 to-slate-950 px-3 py-1 rounded-xl border border-purple-500/20 shadow-inner group">
                    <div class="relative w-7 h-7 flex items-center justify-center bg-purple-950/60 rounded-lg border border-purple-500/40 overflow-hidden">
                        <span class="absolute inset-0 bg-purple-500/10 animate-ping rounded-full scale-75"></span>
                        <i class="fa-solid fa-compact-disc text-purple-400 text-sm"></i>
                    </div>
                    <div class="flex flex-col pr-1 text-left">
                        <span class="text-[11px] font-black tracking-tighter text-slate-200 leading-none">PEGIA HD</span>
                        <span class="text-[9px] font-bold text-purple-400 tracking-widest leading-none mt-0.5">&bull; ONLINE &bull;</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 p-6 pb-36">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 w-full" id="stationsGrid">
                </div>
        </main>
    </div>

    <div id="addStationModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
            <h3 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-purple-500"></i> Dodaj novu stanicu
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-1">Naziv Stanice</label>
                    <input type="text" id="newStationName" placeholder="Npr. Radio Pegia" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-1">Streaming URL (.mp3 / .aac)</label>
                    <input type="text" id="newStationUrl" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-400 block mb-1">Kod Države (Npr. IT, ES)</label>
                        <input type="text" id="newStationCountry" placeholder="IT" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500 uppercase">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-400 block mb-1">Žanr / Tagovi</label>
                        <input type="text" id="newStationTags" placeholder="Pop, Hits" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
                    </div>
                </div>
            </div>
            <div class="mt-6 flex items-center justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 transition">Otkaži</button>
                <button onclick="saveNewStation()" class="px-4 py-2 rounded-xl text-sm font-medium bg-purple-600 hover:bg-purple-500 text-white transition">Sačuvaj</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-4 flex flex-col sm:flex-row items-center justify-between gap-4 z-50">
        <div class="flex items-center gap-3.5 w-full sm:w-1/3 min-w-0">
            <div class="w-12 h-12 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center shrink-0 overflow-hidden" id="playerLogoContainer">
                <i class="fa-solid fa-compact-disc text-xl text-slate-600 animate-spin"></i>
            </div>
            <div class="min-w-0 text-left">
                <h4 class="text-sm font-semibold text-slate-200 truncate" id="currentStationName">Izaberite stanicu</h4>
                <p class="text-xs text-slate-500 truncate mt-0.5" id="currentStationStatus">Ugašeno</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button id="playBtn" class="w-11 h-11 rounded-full bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center text-lg transition active:scale-95">
                <i class="fa-solid fa-play"></i>
            </button>
        </div>

        <div class="flex items-center gap-2.5 w-full sm:w-1/3 justify-end">
            <i class="fa-solid fa-volume-low text-slate-500 text-sm" id="volumeIcon"></i>
            <input type="range" id="volumeSlider" min="0" max="100" value="80" class="w-24 sm:w-28 accent-purple-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
        </div>
    </div>

    <script>
        // Baza stanica sa ugrađenim logotipima
        const premiumLocalDatabase = [
            { name: "Radio 105", url: "https://icecast.unitedradio.it/Radio105.mp3", countrycode: "IT", tags: "Hits, Pop", logo: "https://www.105.net/resizer/1200/630/true/1473934335478.jpg" },
            { name: "Radio 105 Hits", url: "https://icy.unitedradio.it/105Hits.mp3", countrycode: "IT", tags: "Pop, Top 40", logo: "https://www.105.net/resizer/1200/630/true/1473934335478.jpg" },
            { name: "Radio 105 2k and More", url: "http://icy.unitedradio.it:80/1052kandMore.mp3", countrycode: "IT", tags: "00s, Pop", logo: "https://www.105.net/resizer/1200/630/true/1473934335478.jpg" },
            { name: "Radio 105 HipHop RnB", url: "https://icy.unitedradio.it/105HipHopRnB.mp3", countrycode: "IT", tags: "HipHop, RnB", logo: "https://www.105.net/resizer/1200/630/true/1473934335478.jpg" },
            { name: "Radio 105 InDaKlubb", url: "https://icy.unitedradio.it/105InDaKlubb.mp3", countrycode: "IT", tags: "House, Dance", logo: "https://www.105.net/resizer/1200/630/true/1473934335478.jpg" },
            { name: "Radio 105 Miami", url: "https://icy.unitedradio.it/105Miami.mp3", countrycode: "IT", tags: "Urban, Reggaeton", logo: "https://www.105.net/resizer/1200/630/true/1473934335478.jpg" },
            { name: "Radio 105 Story", url: "https://icy.unitedradio.it/105Story.mp3", countrycode: "IT", tags: "Classic Hits", logo: "https://www.105.net/resizer/1200/630/true/1473934335478.jpg" },
            { name: "RTL 102.5", url: "https://streamingv2.shoutcast.com/rtl-1025", countrycode: "IT", tags: "Pop, Hits", logo: "https://images.rtl.it/RTL1025Flussi/Logos/rtl-1025-fb.png" },
            { name: "Radio Zeta (RTL)", url: "https://streamingv2.shoutcast.com/radio-zeta", countrycode: "IT", tags: "Italian Pop, Youth", logo: "https://images.rtl.it/RTL1025Flussi/Logos/radio-zeta-fb.png" },
            { name: "RTL Romeo And Juliet", url: "https://streamingv2.shoutcast.com/rtl-1025-romeoandjuliet", countrycode: "IT", tags: "Love Songs", logo: "https://images.rtl.it/RTL1025Flussi/Logos/rtl-1025-fb.png" },
            { name: "Radio Kiss Kiss", url: "https://ice07.fluidstream.net/KissKiss.aac?FLID=8", countrycode: "IT", tags: "Pop, Hits", logo: "https://www.kisskiss.it/wp-content/uploads/2021/05/kisskiss-logo.png" },
            { name: "Radio Kiss Kiss Hits", url: "https://ice08.fluidstream.net/kk_hits.aac", countrycode: "IT", tags: "Top 40", logo: "https://www.kisskiss.it/wp-content/uploads/2021/05/kisskiss-logo.png" },
            { name: "Radio Kiss Kiss History Hits", url: "https://ice08.fluidstream.net/kk_history.aac", countrycode: "IT", tags: "Oldies", logo: "https://www.kisskiss.it/wp-content/uploads/2021/05/kisskiss-logo.png" },
            { name: "Radio Kiss Kiss Latina", url: "https://ice08.fluidstream.net/kk_latina.aac", countrycode: "IT", tags: "Latino", logo: "https://www.kisskiss.it/wp-content/uploads/2021/05/kisskiss-logo.png" },
            { name: "Radio Kiss Kiss Rock", url: "https://ice08.fluidstream.net/kk_rock.aac", countrycode: "IT", tags: "Rock", logo: "https://www.kisskiss.it/wp-content/uploads/2021/05/kisskiss-logo.png" },
            { name: "Radio Subasio", url: "https://icy.unitedradio.it/Subasio.mp3", countrycode: "IT", tags: "Pop, Melodic", logo: "https://www.radiosubasio.it/wp-content/uploads/2019/01/logo-fb-subasio.png" },
            { name: "Latte Miele", url: "https://ice02.fluidstream.net:80/fluid016.aac", countrycode: "IT", tags: "Italian Music, Pop", logo: "https://www.lattemiele.com/wp-content/uploads/2021/03/lattemiele-logo.png" },
            { name: "Discoradio", url: "https://stream.discoradio.radio/audio/disco.stream_aac/playlist.m3u8", countrycode: "IT", tags: "Dance, Electronic", logo: "https://www.discoradio.it/wp-content/uploads/2020/09/discoradio-logo.png" },
            { name: "Dimensione Suono Roma", url: "https://stream.dimensionesuonoroma.radio/audio/dsr.stream_aac/playlist.m3u8", countrycode: "IT", tags: "Pop, Dance", logo: "https://www.dimensionesuonoroma.it/wp-content/uploads/2020/09/dsr-logo.png" },
            { name: "Dimensione Suono Soft", url: "https://stream.dimensionesuonosoft.radio/audio/dssc.stream_aac/playlist.m3u8", countrycode: "IT", tags: "Soft, Chill", logo: "https://www.dimensionesuonosoft.it/wp-content/uploads/2020/09/dss-logo.png" },
            { name: "R101", url: "https://icecast.unitedradio.it/r101_mp3", countrycode: "IT", tags: "Pop, 80s, 90s", logo: "https://www.r101.it/resizer/1200/630/true/1473934335478.jpg" },
            { name: "Radio Freccia", url: "https://streamingv2.shoutcast.com/radiofreccia", countrycode: "IT", tags: "Rock, Hard Rock", logo: "https://images.rtl.it/RTL1025Flussi/Logos/radiofreccia-fb.png" },
            { name: "LifeGate Radio", url: "https://stream7.xdevel.com/audio0s975809-426/stream/icecast.audio", countrycode: "IT", tags: "Jazz, Chill, Indie", logo: "https://www.lifegate.it/app/uploads/2020/04/lifegate-logo.png" },
            
            // EVROPA
            { name: "Los 40 Spain", url: "https://25653.live.streamtheworld.com/LOS40_SC", countrycode: "ES", tags: "Pop, Latino", logo: "" },
            { name: "RFM Portugal", url: "https://streaming-live.renascencamedia.pt/rfm/mp3", countrycode: "PT", tags: "Pop, Dance", logo: "" },
            { name: "Dromos FM", url: "https://stream.dromosfm.gr/dromos898", countrycode: "GR", tags: "Greek Pop", logo: "" },
            { name: "Super FM Cyprus", url: "https://stream.superfm.com.cy/live", countrycode: "CY", tags: "Pop, Hits", logo: "" },
            { name: "Bay Malta", url: "https://stream.bay.com.mt/bay", countrycode: "MT", tags: "Top 40, Pop", logo: "" },
            { name: "RMF FM Poland", url: "https://www.rmfonline.pl/rmf_fm.mp3", countrycode: "PL", tags: "Pop, News", logo: "" },
            { name: "Kiss FM Romania", url: "https://live.kissfm.ro/kissfm.mp3", countrycode: "RO", tags: "Top 40, Dance", logo: "" }
        ];

        let currentAudio = new Audio();
        let isPlaying = false;
        let activeStation = null;
        let selectedCountry = 'ALL';

        const stationsGrid = document.getElementById('stationsGrid');
        const searchBox = document.getElementById('searchBox');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const currentStationName = document.getElementById('currentStationName');
        const currentStationStatus = document.getElementById('currentStationStatus');
        const playerLogoContainer = document.getElementById('playerLogoContainer');
        const statsCount = document.getElementById('statsCount');
        const addStationModal = document.getElementById('addStationModal');

        function getInitials(name) {
            return name.replace(/[^a-zA-Z0-9 ]/g, '').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        // GLAVNI RENDER KOJI AUTOMATSKI POPRAVLJA SLIKE AKO NE RADE
        function renderStations(stations) {
            stationsGrid.innerHTML = '';
            statsCount.innerText = `${stations.length} Stanica Učitano`;

            stations.forEach(station => {
                const card = document.createElement('div');
                card.className = "radio-card bg-slate-900/40 border border-slate-800/80 rounded-xl p-3 hover:bg-slate-800/40 hover:border-purple-500/50 transition cursor-pointer group flex items-center gap-3 w-full";
                
                const initials = getInitials(station.name);
                let logoHTML = '';
                
                if (station.logo && station.logo !== "") {
                    // Ako eksterni link za sliku baci grešku (403/404), onerror je odmah menja čistim okruglim inicijalom
                    logoHTML = `<img src="${station.logo}" alt="${station.name}" class="w-full h-full object-cover rounded-lg" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div style="display:none;" class="w-full h-full bg-purple-950/40 text-purple-400 font-bold text-sm flex items-center justify-center rounded-lg">${initials}</div>`;
                } else {
                    logoHTML = `<div class="w-full h-full bg-purple-950/40 text-purple-400 font-bold text-sm flex items-center justify-center rounded-lg">${initials}</div>`;
                }

                card.innerHTML = `
                    <div class="w-12 h-12 rounded-lg bg-slate-950 border border-slate-800 shrink-0 overflow-hidden flex items-center justify-center group-hover:border-purple-500/30 transition">
                        ${logoHTML}
                    </div>
                    <div class="min-w-0 flex-1 text-left">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-sm font-semibold text-slate-200 group-hover:text-purple-400 transition truncate">${station.name}</span>
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-950 border border-slate-800 text-slate-400 uppercase shrink-0">${station.countrycode}</span>
                        </div>
                        <p class="text-xs text-slate-500 truncate mt-0.5">${station.tags}</p>
                    </div>
                `;

                card.addEventListener('click', () => playStation(station));
                stationsGrid.appendChild(card);
            });
        }

        function filterByCountry(code) {
            selectedCountry = code;
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${code}`).classList.add('active');
            
            if (code === 'ALL') {
                renderStations(premiumLocalDatabase);
            } else {
                const filtered = premiumLocalDatabase.filter(s => s.countrycode === code);
                renderStations(filtered);
            }
        }

        function playStation(station) {
            if (activeStation && activeStation.url === station.url) {
                togglePlay();
                return;
            }

            currentStationStatus.innerText = 'Učitavanje strima...';
            currentAudio.src = station.url;
            
            currentAudio.play()
                .then(() => {
                    isPlaying = true;
                    activeStation = station;
                    playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    currentStationName.innerText = station.name;
                    currentStationStatus.innerText = 'Emituje se uživo...';
                    
                    const initials = getInitials(station.name);
                    if (station.logo && station.logo !== "") {
                        playerLogoContainer.innerHTML = `
                            <img src="${station.logo}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div style="display:none;" class="w-full h-full bg-purple-950/40 text-purple-400 font-bold flex items-center justify-center text-sm">${initials}</div>`;
                    } else {
                        playerLogoContainer.innerHTML = `<div class="w-full h-full bg-purple-950/40 text-purple-400 font-bold flex items-center justify-center text-sm">${initials}</div>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    currentStationStatus.innerText = 'Strim nedostupan';
                    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                });
        }

        function togglePlay() {
            if (!activeStation) return;
            if (isPlaying) {
                currentAudio.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                currentStationStatus.innerText = 'Pauzirano';
            } else {
                currentAudio.play()
                    .then(() => {
                        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                        currentStationStatus.innerText = 'Emituje se uživo...';
                    })
                    .catch(() => {
                        currentStationStatus.innerText = 'Strim nedostupan';
                    });
            }
            isPlaying = !isPlaying;
        }

        function openModal() { addStationModal.classList.remove('hidden'); }
        function closeModal() { addStationModal.classList.add('hidden'); }
        
        function saveNewStation() {
            const name = document.getElementById('newStationName').value;
            const url = document.getElementById('newStationUrl').value;
            const country = document.getElementById('newStationCountry').value.toUpperCase() || 'IT';
            const tags = document.getElementById('newStationTags').value || 'Radio';

            if(!name || !url) {
                alert('Molimo popunite naziv i URL stanice!');
                return;
            }

            const newStation = { name, url, countrycode: country, tags, logo: "" };
            premiumLocalDatabase.unshift(newStation);
            
            filterByCountry(selectedCountry);
            closeModal();
            
            document.getElementById('newStationName').value = '';
            document.getElementById('newStationUrl').value = '';
            document.getElementById('newStationCountry').value = '';
            document.getElementById('newStationTags').value = '';
        }

        playBtn.addEventListener('click', togglePlay);

        volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value;
            currentAudio.volume = vol / 100;
            if (vol == 0) {
                volumeIcon.className = "fa-solid fa-volume-xmark text-slate-600";
            } else if (vol < 50) {
                volumeIcon.className = "fa-solid fa-volume-low text-slate-500";
            } else {
                volumeIcon.className = "fa-solid fa-volume-high text-purple-500";
            }
        });

        searchBox.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = premiumLocalDatabase.filter(station => 
                (selectedCountry === 'ALL' || station.countrycode === selectedCountry) &&
                (station.name.toLowerCase().includes(query) || station.tags.toLowerCase().includes(query))
            );
            renderStations(filtered);
        });

        // Inicijalno pokretanje bez petlji koje mogu da puknu
        renderStations(premiumLocalDatabase);
        currentAudio.volume = volumeSlider.value / 100;
    </script>
</body>
</html>
