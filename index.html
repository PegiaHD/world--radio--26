<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Radio 26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .filter-btn.active {
            background-image: linear-gradient(to right, #a855f7, #ec4899);
            border-color: transparent;
            color: white;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <div class="flex-1 flex flex-col max-w-7xl w-full mx-auto p-4 md:p-6 pb-32">
        <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent flex items-center gap-3">
                    <i class="fa-solid fa-earth-americas text-purple-500 animate-pulse"></i> World Radio 26
                </h1>
                <p class="text-slate-400 text-sm mt-1">Globalni radio agregator • Premium USA & EU mreža</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAdminModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm font-semibold px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-lg transition-all">
                    <i class="fa-solid fa-plus"></i> Dodaj stanicu
                </button>
                <div id="stats" class="text-xs md:text-sm text-slate-400 bg-slate-900/80 px-4 py-2.5 rounded-xl border border-slate-800 font-medium">Učitavanje...</div>
            </div>
        </header>

        <div class="space-y-4 mb-6">
            <div class="relative max-w-2xl w-full">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </div>
                <input type="text" id="search-input" class="w-full bg-slate-900 border border-slate-800 rounded-2xl pl-12 pr-4 py-3.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all text-base" placeholder="Pretraži Z100, Naxi, Rock, Hitove...">
            </div>

            <div class="flex flex-wrap gap-2 items-center text-sm">
                <button onclick="filterBy('all')" class="filter-btn active bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl transition-all font-medium">Sve stanice</button>
                <button onclick="filterBy('US')" class="filter-btn bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5 font-medium">🇺🇸 SAD</button>
                <button onclick="filterBy('IT')" class="filter-btn bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5 font-medium">🇮🇹 Italija</button>
                <button onclick="filterBy('DE')" class="filter-btn bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5 font-medium">🇩🇪 Nemačka</button>
                <button onclick="filterBy('RS')" class="filter-btn bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5 font-medium">🇷🇸 Srbija & Ex-Yu</button>
                <button onclick="filterBy('custom')" class="filter-btn bg-slate-900 border border-emerald-900 text-emerald-400 px-3.5 py-1.5 rounded-xl transition-all font-medium">Moje stanice</button>
            </div>
        </div>

        <main class="flex-1">
            <div id="stations-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
            <div id="no-results" class="hidden text-center py-20">
                <i class="fa-solid fa-radio text-5xl text-slate-700 mb-4 block"></i>
                <h3 class="text-xl font-medium text-slate-400">Nema rezultata za pretragu</h3>
            </div>
        </main>
    </div>

    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-xl font-bold mb-4 text-white">Dodaj novu radio stanicu</h3>
            <form id="add-station-form" class="space-y-4">
                <input type="text" id="custom-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="Naziv stanice">
                <input type="url" id="custom-url" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="URL strima (link)">
                <select id="custom-country" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white">
                    <option value="US">🇺🇸 SAD</option>
                    <option value="RS">🇷🇸 Srbija</option>
                    <option value="IT">🇮🇹 Italija</option>
                    <option value="DE">🇩🇪 Nemačka</option>
                </select>
                <input type="url" id="custom-favicon" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="URL Logotipa (Link do slike)">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-colors">Sačuvaj u bazu</button>
            </form>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-850 p-4 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 w-full sm:w-1/3">
                <div id="player-logo-container" class="w-14 h-14 bg-slate-950 rounded-xl flex items-center justify-center border border-slate-800 overflow-hidden shrink-0">
                    <i id="player-placeholder-icon" class="fa-solid fa-earth-americas text-xl text-purple-500"></i>
                    <img id="player-logo" src="" class="hidden w-full h-full object-cover">
                </div>
                <div class="min-w-0">
                    <h4 id="player-title" class="text-sm font-semibold truncate text-slate-200">Izaberite stanicu</h4>
                    <p class="text-xs text-slate-400 mt-0.5 truncate"><span id="player-genre">Kliknite na bilo koji radio</span></p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="play-pause-btn" disabled class="w-12 h-12 rounded-full bg-purple-600 text-white flex items-center justify-center shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                    <i id="play-icon" class="fa-solid fa-play text-lg ml-0.5"></i>
                </button>
                <div id="buffer-indicator" class="hidden text-xs text-purple-400 animate-pulse font-medium"><i class="fa-solid fa-spinner animate-spin mr-1"></i> Učitavanje...</div>
            </div>

            <div class="hidden sm:flex items-center justify-end gap-3 w-1/3 text-slate-400">
                <i class="fa-solid fa-volume-high text-sm"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" class="w-24 accent-purple-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>
    </footer>

    <script>
        const proxy = "https://cors-anywhere.herokuapp.com/"; 

        const premiumLocalDatabase = [
            // SAD (USA) Premium
            { name: "WHTZ Z100 New York", url: "https://stream.revma.com/revma/v1/streams/whtz-fm/icecast", countrycode: "US", tags: "Pop, Top 40, Hits", favicon: "https://upload.wikimedia.org/wikipedia/commons/4/4b/Z100_logo.svg" },
            { name: "KIIS FM Los Angeles", url: "https://stream.revma.com/revma/v1/streams/kiis-fm/icecast", countrycode: "US", tags: "Dance, Pop, Hits", favicon: "https://upload.wikimedia.org/wikipedia/en/2/2b/KIIS-FM_Logo.png" },
            { name: "KEXP 90.3 Seattle", url: "https://kexp-mp3-128.streamguys1.com/kexp128.mp3", countrycode: "US", tags: "Indie, Rock, Alternative", favicon: "https://upload.wikimedia.org/wikipedia/commons/e/e0/KEXP-Logo.svg" },
            
            // SRBIJA & EX-YU
            { name: "Naxi Radio", url: "https://streaming.naxi.rs/naxi128.mp3", countrycode: "RS", tags: "Pop, Domuća muzika", favicon: "https://www.naxi.rs/images/logo.png" },
            { name: "TDI Radio", url: "https://streaming.tdiradio.com/tdi.mp3", countrycode: "RS", tags: "Dance, House, Club", favicon: "https://www.tdiradio.com/images/tdi-logo.png" },
            { name: "Radio Karolina", url: "https://streaming.karolina.rs/karolina128.mp3", countrycode: "RS", tags: "Oldies, Light Pop", favicon: "https://www.karolina.rs/images/logo.png" },
            
            // ITALIJA & NEMAČKA
            { name: "RTL 102.5 Italy", url: "https://shoutcast.rtl.it:3010/stream/1/", countrycode: "IT", tags: "Pop, Hits", favicon: "https://rtl.it/favicon.ico" },
            { name: "Rock Antenne Germany", url: "https://stream.rockantenne.de/rockantenne/stream/mp3", countrycode: "DE", tags: "Rock, Metal, Classic", favicon: "https://rockantenne.de/favicon.ico" }
        ];

        let apiStations = [];
        let combinedStations = [];
        let activeFilter = 'all';
        const audio = new Audio();

        // Falback u slučaju greške
        audio.addEventListener('error', function() {
            if(!audio.src.startsWith(proxy) && audio.src.startsWith('http://')) {
                audio.src = proxy + audio.src;
                audio.play().catch(() => document.getElementById('play-icon').className = "fa-solid fa-play text-lg ml-0.5");
            }
        });

        async function initRadio() {
            try {
                const response = await fetch('https://de1.api.radio-browser.info/json/stations/bycountrycodeexact/US?limit=60');
                if (response.ok) {
                    const data = await response.json();
                    apiStations = data.filter(s => s.url_resolved.startsWith('https')).map(s => ({
                        name: s.name,
                        url: s.url_resolved,
                        countrycode: s.countrycode,
                        tags: s.tags,
                        favicon: s.favicon
                    }));
                }
            } catch (error) { console.log("API offline, učitavam lokalne."); }
            refreshData();
        }

        function refreshData() {
            const custom = JSON.parse(localStorage.getItem('customRadioStations')) || [];
            combinedStations = [...custom, ...premiumLocalDatabase, ...apiStations];
            const unique = new Map();
            combinedStations.forEach(s => { if(s.name && s.url) unique.set(s.name.toLowerCase(), s); });
            combinedStations = Array.from(unique.values());
            document.getElementById('stats').innerText = `Ukupno stanica: ${combinedStations.length}`;
            applyFilter();
        }

        function filterBy(type) {
            activeFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            applyFilter();
        }

        function applyFilter() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            let filtered = combinedStations;
            if (activeFilter !== 'all' && activeFilter !== 'custom') {
                filtered = combinedStations.filter(s => s.countrycode?.toUpperCase() === activeFilter);
            } else if (activeFilter === 'custom') {
                const customNames = (JSON.parse(localStorage.getItem('customRadioStations')) || []).map(c => c.name.toLowerCase());
                filtered = combinedStations.filter(s => customNames.includes(s.name.toLowerCase()));
            }
            if (query) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(query) || (s.tags && s.tags.toLowerCase().includes(query)));
            }
            render(filtered);
        }

        function render(stations) {
            const grid = document.getElementById('stations-grid');
            grid.innerHTML = '';
            
            if(stations.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                return;
            } else {
                document.getElementById('no-results').classList.add('hidden');
            }

            stations.forEach(s => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4 cursor-pointer hover:bg-slate-800 hover:border-purple-500/50 transition-all group animate-fadeIn";
                
                // Popravka za slomljene sličice na mreži
                const imageTag = s.favicon ? `<img src="${s.favicon}" onerror="this.outerHTML='<i class=\'fa-solid fa-radio text-slate-500 text-lg\'></i>'" class="w-full h-full object-cover">` : `<i class="fa-solid fa-radio text-slate-600 text-lg"></i>`;
                
                card.innerHTML = `
                    <div class="w-14 h-14 bg-slate-950 rounded-xl flex items-center justify-center overflow-hidden shrink-0 relative border border-slate-800">
                        ${imageTag}
                        <div class="absolute inset-0 bg-purple-600/80 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <i class="fa-solid fa-play text-white text-sm"></i>
                        </div>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="text-sm font-bold truncate text-slate-200">${s.name}</h3>
                        <p class="text-xs text-slate-400 truncate mt-0.5">${s.tags || 'Muzika uživo'}</p>
                    </div>
                `;
                card.onclick = () => play(s);
                grid.appendChild(card);
            });
        }

        function play(s) {
            const btn = document.getElementById('play-pause-btn');
            const icon = document.getElementById('play-icon');
            const buffer = document.getElementById('buffer-indicator');
            
            btn.disabled = false;
            buffer.classList.remove('hidden');
            icon.className = "fa-solid fa-spinner animate-spin text-lg";
            
            document.getElementById('player-title').innerText = s.name;
            document.getElementById('player-genre').innerText = s.tags || 'Muzika uživo';
            
            const pLogo = document.getElementById('player-logo');
            const pIcon = document.getElementById('player-placeholder-icon');
            
            if(s.favicon) {
                pIcon.classList.add('hidden');
                pLogo.src = s.favicon;
                pLogo.classList.remove('hidden');
                // Ako slika u plejeru pukne, vrati sistemsku ikonu
                pLogo.onerror = () => { pLogo.classList.add('hidden'); pIcon.classList.remove('hidden'); }
            } else {
                pLogo.classList.add('hidden');
                pIcon.classList.remove('hidden');
            }

            audio.src = s.url;
            audio.play()
                .then(() => { 
                    icon.className = "fa-solid fa-pause text-lg"; 
                    buffer.classList.add('hidden');
                })
                .catch(() => { 
                    buffer.classList.add('hidden');
                    icon.className = "fa-solid fa-play text-lg ml-0.5"; 
                });
        }

        document.getElementById('play-pause-btn').onclick = () => {
            const icon = document.getElementById('play-icon');
            if (audio.paused) { audio.play(); icon.className = "fa-solid fa-pause text-lg"; }
            else { audio.pause(); icon.className = "fa-solid fa-play text-lg ml-0.5"; }
        };

        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;
        document.getElementById('search-input').oninput = applyFilter;
        function toggleAdminModal() { document.getElementById('admin-modal').classList.toggle('hidden'); }

        document.getElementById('add-station-form').onsubmit = (e) => {
            e.preventDefault();
            const ns = { 
                name: document.getElementById('custom-name').value, 
                url: document.getElementById('custom-url').value, 
                countrycode: document.getElementById('custom-country').value, 
                favicon: document.getElementById('custom-favicon').value 
            };
            const cur = JSON.parse(localStorage.getItem('customRadioStations')) || [];
            cur.unshift(ns);
            localStorage.setItem('customRadioStations', JSON.stringify(cur));
            toggleAdminModal();
            refreshData();
            document.getElementById('add-station-form').reset();
        };

        initRadio();
    </script>
</body>
</html>
